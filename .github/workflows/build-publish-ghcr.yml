name: Verify and publish GHCR image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: lotto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: App and dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run security:audit
      - run: npm run lint
      - run: npm run test:seller-cache
      - run: bash scripts/test-manual-build.sh
      - run: npm run build
      - name: Retain dependency reports, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14

  image-security:
    name: Image CVEs (${{ matrix.arch }}, all severities)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: false
      - name: Build and scan the exact release archive, without publishing
        env:
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ github.sha }}
        run: bash scripts/build-scan-image.sh "$ARCH" "$RUNNER_TEMP/release/$ARCH" "$REVISION"
      - name: Retain complete CVE reports, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release/${{ matrix.arch }}/trivy-*.json
            ${{ runner.temp }}/release/${{ matrix.arch }}/trivy-*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Transfer only a successfully scanned archive
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish only the scanned multi-platform images
    needs: [verify, image-security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-release-amd64
          path: ${{ runner.temp }}/release/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-release-arm64
          path: ${{ runner.temp }}/release/arm64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify archive identity and publish, without rebuilding
        run: |
          bash scripts/publish-scanned-images.sh ghcr.io/kasumil/lotto-nextjs \
            "$RUNNER_TEMP/release" "$GITHUB_SHA" "run-$GITHUB_RUN_NUMBER" latest
