name: Verify and publish GHCR image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: lotto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: Classify release scope (fail closed)
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Never execute the candidate HEAD classifier in the release decision.
        # PR: trusted target SHA; push: previous main ref SHA (not proof of deployment).
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TRUSTED_CLASSIFIER="$RUNNER_TEMP/trusted-release-scope.py"
          if ! git show "$BASE_SHA:scripts/release-scope.py" > "$TRUSTED_CLASSIFIER"; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A broken trusted classifier must request the full gate, not skip it.
          DECISION_FILE="$RUNNER_TEMP/release-scope-output"
          : > "$DECISION_FILE"
          if GITHUB_OUTPUT="$DECISION_FILE" python3 "$TRUSTED_CLASSIFIER" &&
             [[ $(cat "$DECISION_FILE") =~ ^required=(true|false)$ ]]; then
            cat "$DECISION_FILE" >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: App and dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/test-release-scope.py
      - run: npm ci
      - run: npm run test:security
      - run: node --test scripts/test-native-image-runners.mjs
      - run: npm run security:audit
      - run: npm run lint
      - run: npm run test:seller-cache
      - run: npm run test:store-search
      - run: bash scripts/test-manual-build.sh
      - run: npm run build
      - name: Retain dependency reports, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14

  image-security:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: Image CVEs (${{ matrix.arch }}, all severities)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Build native images: ARM Node/npm must not execute through QEMU.
      - name: Verify native runner architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner architecture does not match $ARCH" >&2; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: false
      - name: Build and scan the exact release archive, without publishing
        env:
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ github.sha }}
        run: bash scripts/build-scan-image.sh "$ARCH" "$RUNNER_TEMP/release/$ARCH" "$REVISION"
      - name: Retain complete CVE reports, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release/${{ matrix.arch }}/trivy-*.json
            ${{ runner.temp }}/release/${{ matrix.arch }}/trivy-*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Transfer only a successfully scanned archive
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish only the scanned multi-platform images
    needs: [scope, verify, image-security]
    if: needs.scope.outputs.required == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-release-amd64
          path: ${{ runner.temp }}/release/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-release-arm64
          path: ${{ runner.temp }}/release/arm64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify archive identity and publish, without rebuilding
        run: |
          bash scripts/publish-scanned-images.sh ghcr.io/kasumil/lotto-nextjs \
            "$RUNNER_TEMP/release" "$GITHUB_SHA" "run-$GITHUB_RUN_NUMBER" latest
