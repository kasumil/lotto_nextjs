name: Review GHCR count retention (dry run only)
on:
  push:
    branches:
      - ghcr-retention-dry-run-review
  workflow_dispatch:
    inputs:
      protection_json:
        description: 'Fresh package-scoped snapshot: package, captured_at, source, current, previous, rollback'
        required: false
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: ghcr-retention-review-${{ github.repository }}
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/ghcr-retention-dry-run-review' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline safety tests
        run: python3 -B -m unittest discover -s tests/ghcr_retention -v
      - name: Produce review only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTION_JSON: ${{ inputs.protection_json }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROTECTION_JSON}" ]]; then
            test -f .github/retention-protection.json
            export PROTECTION_JSON="$(cat .github/retention-protection.json)"
          fi
          python3 -B .github/retention/ghcr_retention.py
